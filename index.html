<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCLTech | Continuous Improvement & Lean Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9; color: #0f172a;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px 14px;
    }
    .portal-card {
      background: #ffffff; width: 100%; max-width: 520px;
      border-radius: 8px; border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden;
    }
    .portal-header {
      background: linear-gradient(135deg, #0d3b66 0%, #005691 100%);
      padding: 20px; color: #ffffff; display: flex; align-items: center; gap: 14px;
      border-bottom: 3px solid #00a896;
    }
    .header-text h1 { font-size: 18px; font-weight: 700; }
    .header-text p { font-size: 12px; color: #bae6fd; }
    .portal-body { padding: 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    input[type="text"], textarea {
      width: 100%; padding: 10px; font-size: 14px; border: 1px solid #cbd5e1;
      border-radius: 6px; background: #f8fafc; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 80px; }
    .btn-submit {
      background: #005691; color: #fff; border: none; width: 100%;
      padding: 12px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer;
    }
    .btn-submit:hover { background: #034473; }
    .ticket-view { display: none; }
    .status-badge {
      display: inline-block; padding: 6px 12px; font-size: 13px;
      font-weight: 700; border-radius: 20px; background: #e0f2fe; color: #0369a1;
      margin-bottom: 12px;
    }
    .chat-box {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 14px; max-height: 300px; overflow-y: auto; margin-bottom: 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .chat-bubble {
      padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.4; max-width: 85%;
      word-wrap: break-word;
    }
    .admin-bubble {
      background: #0f172a; color: white; align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .user-bubble {
      background: #005691; color: white; align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .chat-input-row { display: flex; gap: 8px; }
    .chat-input-row input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .chat-input-row button {
      background: #005691; color: white; border: none; padding: 0 16px;
      border-radius: 6px; font-weight: 600; cursor: pointer;
    }

    /* Admin View */
    #adminView { display: none; }
    .admin-card { background: #1e293b; color: #f8fafc; padding: 22px; border-radius: 12px; }
    .admin-box {
      background: #0f172a; padding: 14px; border-radius: 8px; margin-bottom: 16px;
      max-height: 300px; overflow-y: auto; border: 1px solid #334155;
      display: flex; flex-direction: column; gap: 8px;
    }
    .admin-textarea { background: #0f172a; color: white; border: 1px solid #475569; width: 100%; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    .admin-btn { background: #38bdf8; color: #0f172a; border: none; font-weight: bold; width: 100%; padding: 12px; border-radius: 6px; cursor: pointer; }
    @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- 1. Her View -->
  <div class="portal-card" id="userCard">
    <div class="portal-header">
      <div class="header-text">
        <h1>HCLTech Lean Innovation Desk</h1>
        <p>Continuous Improvement & Value Creation Initiative</p>
      </div>
    </div>

    <div class="portal-body">
      <form id="leanForm" onsubmit="submitProposal(event)">
        <div class="form-grid">
          <div>
            <label>Employee Name</label>
            <input type="text" id="empName" placeholder="Full Name" required />
          </div>
          <div>
            <label>Employee ID</label>
            <input type="text" id="empId" placeholder="e.g. 52148903" required />
          </div>
        </div>
        <div class="form-group">
          <label>New Lean Idea / Subject</label>
          <input type="text" id="leanIdea" placeholder="Title of suggestion" required />
        </div>
        <div class="form-group">
          <label>Project Name</label>
          <input type="text" id="projectName" placeholder="Account Name" required />
        </div>
        <div class="form-group">
          <label>Detailed Suggestion Box</label>
          <textarea id="suggestion" placeholder="Describe the operational friction..." required></textarea>
        </div>
        <button type="submit" class="btn-submit" id="btnText">Submit Lean Proposal</button>
      </form>

      <div id="ticketView" class="ticket-view">
        <span class="status-badge" id="ticketStatus">Status: Under Active Desk Review</span>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 12px;">Ticket Reference: <strong>HCL-LN-962234</strong></p>
        
        <div class="chat-box" id="userChatBox"></div>

        <form class="chat-input-row" onsubmit="sendUserReply(event)">
          <input type="text" id="userReplyInput" placeholder="Type a response to the reviewer..." required />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 2. Your Admin View -->
  <div class="portal-card admin-card" id="adminView">
    <h2 style="color: #38bdf8; margin-bottom: 12px; font-size: 18px;">Control Operator (You)</h2>
    <div class="admin-box" id="adminChatBox"></div>
    <textarea class="admin-textarea" id="adminReplyMsg" rows="2" placeholder="Type reply to send to her screen..."></textarea>
    <button class="admin-btn" onclick="sendAdminReply()">Push Reply to Her Screen</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAeNdIduJUsW9-eDlLFRi3i3PKA-9AgtMI",
      authDomain: "hcl-portal-61844.firebaseapp.com",
      projectId: "hcl-portal-61844",
      storageBucket: "hcl-portal-61844.firebasestorage.app",
      messagingSenderId: "706863694182",
      appId: "1:706863694182:web:53f71d16ae0f8697e908a7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ticketRef = doc(db, "tickets", "live-ticket");

    if (window.location.hash === "#admin") {
      document.getElementById("userCard").style.display = "none";
      document.getElementById("adminView").style.display = "block";

      onSnapshot(ticketRef, (docSnap) => {
        const data = docSnap.data();
        if (data && data.messages) {
          const box = document.getElementById("adminChatBox");
          box.innerHTML = data.messages.map(m => `
            <div class="chat-bubble ${m.sender === 'admin' ? 'admin-bubble' : 'user-bubble'}">
              <strong>${m.sender === 'admin' ? 'You' : 'Her'}:</strong> ${m.text}
            </div>
          `).join('');
          box.scrollTop = box.scrollHeight;
        }
      });
    }

    window.submitProposal = async function(e) {
      e.preventDefault();
      const initialText = document.getElementById("suggestion").value;
      const initialIdea = document.getElementById("leanIdea").value;

      await setDoc(ticketRef, {
        name: document.getElementById("empName").value,
        id: document.getElementById("empId").value,
        idea: initialIdea,
        messages: [
          { sender: 'user', text: `Proposal: ${initialIdea} - ${initialText}` }
        ]
      });

      activateChat();
    };

    function activateChat() {
      document.getElementById("leanForm").style.display = "none";
      document.getElementById("ticketView").style.display = "block";

      onSnapshot(ticketRef, (docSnap) => {
        const data = docSnap.data();
        if (data && data.messages) {
          const box = document.getElementById("userChatBox");
          box.innerHTML = data.messages.map(m => `
            <div class="chat-bubble ${m.sender === 'admin' ? 'admin-bubble' : 'user-bubble'}">
              ${m.text}
            </div>
          `).join('');
          box.scrollTop = box.scrollHeight;
        }
      });
    }

    window.sendUserReply = async function(e) {
      e.preventDefault();
      const input = document.getElementById("userReplyInput");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      await updateDoc(ticketRef, {
        messages: arrayUnion({ sender: 'user', text: text })
      });
    };

    window.sendAdminReply = async function() {
      const input = document.getElementById("adminReplyMsg");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      await updateDoc(ticketRef, {
        messages: arrayUnion({ sender: 'admin', text: text })
      });
    };

    onSnapshot(ticketRef, (docSnap) => {
      if (window.location.hash !== "#admin" && docSnap.exists() && docSnap.data().messages) {
        activateChat();
      }
    });
  </script>
</body>
</html>
