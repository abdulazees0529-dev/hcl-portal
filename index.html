<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HCLTech Enterprise Service Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
    }

    .desk-wrapper {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
    }

    /* Enterprise Navigation Header */
    .desk-header {
      background: #0f2d59;
      color: #ffffff;
      padding: 14px 20px;
      border-bottom: 3px solid #0284c7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .desk-header-brand { display: flex; align-items: center; gap: 10px; }
    .brand-tag {
      background: #0284c7;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .desk-title { font-size: 15px; font-weight: 600; }
    .status-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background: #ecfdf5;
      color: #065f46;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; }

    /* Sub-header meta bar */
    .ticket-meta-strip {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 20px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* Main Content Area */
    .portal-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      overflow-y: auto;
    }

    /* Intake Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #0f172a;
      font-family: inherit;
    }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: #0284c7; }
    textarea { resize: vertical; min-height: 100px; }
    .btn-submit {
      background: #0284c7;
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-submit:hover { background: #0369a1; }

    /* Realistic Enterprise Chat Room */
    .ticket-view {
      display: none;
      flex: 1;
      flex-direction: column;
      height: 100%;
    }
    .chat-timeline {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 12px;
    }
    .chat-entry { display: flex; flex-direction: column; max-width: 78%; }
    .chat-entry.user { align-self: flex-end; align-items: flex-end; }
    .chat-entry.admin { align-self: flex-start; align-items: flex-start; }

    .chat-sender-info { font-size: 11px; color: #64748b; margin-bottom: 3px; font-weight: 600; }
    .chat-bubble {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      word-wrap: break-word;
    }
    .user .chat-bubble { background: #0284c7; color: #ffffff; border-bottom-right-radius: 1px; }
    .admin .chat-bubble { background: #ffffff; color: #1e293b; border: 1px solid #cbd5e1; border-bottom-left-radius: 1px; }

    .chat-input-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
    .chat-input-bar input { flex: 1; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    .chat-input-bar button {
      background: #0f2d59;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-clear {
      width: 100%;
      background: transparent;
      color: #64748b;
      border: 1px dashed #cbd5e1;
      padding: 9px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-clear:hover { background: #f1f5f9; color: #0f172a; }

    /* Admin Console View */
    #adminView { display: none; }
    .admin-header { background: #0f172a; border-bottom-color: #38bdf8; }
    .admin-timeline { background: #0b1120; border-color: #1e293b; }
    .admin-timeline .admin .chat-bubble { background: #1e293b; color: #f8fafc; border-color: #334155; }
    .admin-timeline .user .chat-bubble { background: #0284c7; color: #ffffff; }
    .admin-textbox {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .admin-send-btn {
      background: #0284c7;
      color: white;
      border: none;
      font-weight: 600;
      width: 100%;
      padding: 11px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .portal-body { padding: 14px; }
    }
  </style>
</head>
<body>

  <!-- Employee Full-Screen Workspace -->
  <div class="desk-wrapper" id="userCard">
    <header class="desk-header">
      <div class="desk-header-brand">
        <span class="brand-tag">HCLTech</span>
        <span class="desk-title">Service Desk Portal</span>
      </div>
      <div class="status-pill">
        <span class="status-dot"></span> System Connected
      </div>
    </header>

    <div class="ticket-meta-strip">
      <span>Queue: <strong>Continuous Improvement Desk</strong></span>
      <span>SLA: <strong>Normal (Active)</strong></span>
    </div>

    <main class="portal-body">
      <form id="leanForm" onsubmit="submitProposal(event)">
        <div class="form-grid">
          <div>
            <label>Employee Name</label>
            <input type="text" id="empName" placeholder="Full Name" required />
          </div>
          <div>
            <label>Employee ID</label>
            <input type="text" id="empId" placeholder="e.g. 52148903" required />
          </div>
        </div>
        <div class="form-group">
          <label>Topic / Initiative Title</label>
          <input type="text" id="leanIdea" placeholder="Brief subject" required />
        </div>
        <div class="form-group">
          <label>Account / Project</label>
          <input type="text" id="projectName" placeholder="Client account name" required />
        </div>
        <div class="form-group">
          <label>Operational Suggestion Details</label>
          <textarea id="suggestion" placeholder="Detailed suggestion description..." required></textarea>
        </div>
        <button type="submit" class="btn-submit" id="btnText">Log Incident & Open Session</button>
      </form>

      <div id="ticketView" class="ticket-view">
        <div class="chat-timeline" id="userChatBox">
          <p style="font-size: 12px; color: #94a3b8; font-style: italic;">Connecting to service queue...</p>
        </div>

        <form class="chat-input-bar" onsubmit="sendUserReply(event)">
          <input type="text" id="userReplyInput" placeholder="Send follow-up message..." required />
          <button type="submit">Dispatch</button>
        </form>

        <button type="button" class="btn-clear" onclick="clearAllMessages()">
          End Support Session & Archive History
        </button>
      </div>
    </main>
  </div>

  <!-- Operator Workstation Console -->
  <div class="desk-wrapper" id="adminView">
    <header class="desk-header admin-header">
      <div class="desk-header-brand">
        <span class="brand-tag" style="background:#38bdf8; color:#0f172a;">OPERATOR</span>
        <span class="desk-title">Tier 2 Service Console</span>
      </div>
      <div class="status-pill" style="background:#1e293b; color:#38bdf8;">
        Live Console
      </div>
    </header>

    <div class="ticket-meta-strip" style="background:#090d16; border-color:#1e293b; color:#94a3b8;">
      <span>Workspace: <strong>Enterprise Service Management Desk</strong></span>
      <span>Session: <strong>Encrypted</strong></span>
    </div>

    <main class="portal-body">
      <div class="chat-timeline admin-timeline" id="adminChatBox">Waiting for employee ticket...</div>
      <textarea class="admin-textbox" id="adminReplyMsg" rows="2" placeholder="Type desk response..."></textarea>
      <button class="admin-send-btn" onclick="sendAdminReply()">Transmit Reply to Employee</button>
      <button class="btn-clear" onclick="clearAllMessages()">Clear Active Ticket Stream</button>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAeNdIduJUsW9-eDlLFRi3i3PKA-9AgtMI",
      authDomain: "hcl-portal-61844.firebaseapp.com",
      projectId: "hcl-portal-61844",
      storageBucket: "hcl-portal-61844.firebasestorage.app",
      messagingSenderId: "706863694182",
      appId: "1:706863694182:web:53f71d16ae0f8697e908a7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ticketRef = doc(db, "tickets", "live-ticket");

    function getTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    window.clearAllMessages = async function() {
      await updateDoc(ticketRef, { messages: [] });
    };

    if (window.location.hash === "#admin") {
      document.getElementById("userCard").style.display = "none";
      document.getElementById("adminView").style.display = "flex";

      onSnapshot(ticketRef, (docSnap) => {
        const data = docSnap.data();
        const box = document.getElementById("adminChatBox");
        if (data && data.messages && data.messages.length > 0) {
          box.innerHTML = data.messages.map(m => `
            <div class="chat-entry ${m.sender}">
              <span class="chat-sender-info">${m.sender === 'admin' ? 'Desk Operator (You)' : (data.name || 'Employee')} • ${m.time}</span>
              <div class="chat-bubble">${m.text}</div>
            </div>
          `).join('');
          box.scrollTop = box.scrollHeight;
        } else {
          box.innerHTML = `<span style="color:#64748b; font-size:12px;">Queue idle. No active messages.</span>`;
        }
      });
    }

    window.submitProposal = async function(e) {
      e.preventDefault();
      const initialText = document.getElementById("suggestion").value;
      const initialIdea = document.getElementById("leanIdea").value;

      await setDoc(ticketRef, {
        name: document.getElementById("empName").value,
        id: document.getElementById("empId").value,
        idea: initialIdea,
        messages: [
          { sender: 'user', text: `${initialIdea}: ${initialText}`, time: getTime() }
        ]
      });

      activateChat();
    };

    function activateChat() {
      document.getElementById("leanForm").style.display = "none";
      document.getElementById("ticketView").style.display = "flex";

      onSnapshot(ticketRef, (docSnap) => {
        const data = docSnap.data();
        const box = document.getElementById("userChatBox");
        if (data && data.messages && data.messages.length > 0) {
          box.innerHTML = data.messages.map(m => `
            <div class="chat-entry ${m.sender}">
              <span class="chat-sender-info">${m.sender === 'admin' ? 'Desk Review Agent' : 'You'} • ${m.time}</span>
              <div class="chat-bubble">${m.text}</div>
            </div>
          `).join('');
          box.scrollTop = box.scrollHeight;
        } else {
          box.innerHTML = `<p style="font-size: 12px; color: #94a3b8; font-style: italic;">Support session closed.</p>`;
        }
      });
    }

    window.sendUserReply = async function(e) {
      e.preventDefault();
      const input = document.getElementById("userReplyInput");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      const snap = await getDoc(ticketRef);
      const list = snap.exists() ? (snap.data().messages || []) : [];
      list.push({ sender: 'user', text: text, time: getTime() });
      await updateDoc(ticketRef, { messages: list });
    };

    window.sendAdminReply = async function() {
      const input = document.getElementById("adminReplyMsg");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      const snap = await getDoc(ticketRef);
      const list = snap.exists() ? (snap.data().messages || []) : [];
      list.push({ sender: 'admin', text: text, time: getTime() });
      await updateDoc(ticketRef, { messages: list });
    };

    onSnapshot(ticketRef, (docSnap) => {
      if (window.location.hash !== "#admin" && docSnap.exists() && docSnap.data().messages) {
        activateChat();
      }
    });
  </script>
</body>
</html>
